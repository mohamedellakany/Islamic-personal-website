<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t.poster_h }} · {{ t.academy }}</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ static('style.css') }}">
<style>
  @page { size: A4; margin: 0 }
  body { background: #ddd }
  .sheet { width: 210mm; min-height: 297mm; margin: 20px auto; background: var(--paper); display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.2) }
  .sheet header { color: #fff; text-align: center; padding: 18mm 10mm 14mm }
  .sheet header img { width: 26mm; height: 26mm; border-radius: 50%; border: 3px solid var(--gold); margin: 0 auto 5mm }
  .sheet header h2 { font-family: Amiri, serif; font-size: 30pt; color: var(--gold-2) }
  .sheet .body { flex: 1; text-align: center; padding: 12mm 10mm }
  .sheet h1 { font-family: Amiri, serif; font-size: 40pt; color: var(--green) }
  .sheet .qrbox { display: inline-block; background: #fff; padding: 6mm; border-radius: 6mm; border: 2px solid var(--gold); margin: 8mm 0 }
  .sheet .qrbox img { width: 95mm; height: 95mm }
  .sheet .hint { font-size: 18pt; color: var(--ink) }
  .sheet .url { font-size: 12pt; color: var(--muted); margin-top: 4mm; font-family: monospace }
  .sheet footer { padding: 8mm; text-align: center; color: #e6d3a3; font-family: Amiri, serif; font-size: 16pt }
  .print-btn { position: fixed; top: 16px; inset-inline-end: 16px; z-index: 10 }
  @media print { body { background: none } .sheet { margin: 0; box-shadow: none } .print-btn { display: none } }
</style>
</head>
<body>
<button class="btn gold print-btn" onclick="print()">🖨 {{ t.print }}</button>
<div class="sheet">
  <header class="pattern">
    {% if ch.avatar %}<img src="{{ ch.avatar }}" alt="">{% endif %}
    <h2>{{ t.academy }}</h2>
  </header>
  <div class="body">
    <h1>{{ t.poster_h }}</h1>
    <div class="qrbox"><img src="{{ url('live_qr', size=20) }}" alt="QR"></div>
    <p class="hint">📱 {{ t.poster_p }}</p>
    <p class="url" dir="ltr">{{ live_url }}</p>
  </div>
  <footer class="pattern">﴿{{ t.ayah }}﴾</footer>
</div>
</body>
</html>
