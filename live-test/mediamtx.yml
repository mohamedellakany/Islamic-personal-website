# Free local live-streaming server for testing (MediaMTX).
# Started by live-test/start.sh, which fills in __STREAM_KEY__. Everything not listed uses MediaMTX defaults.
logLevel: info

authMethod: internal
authInternalUsers:
  # The phone broadcasts to ingest/<private key>; the key in the path is the password,
  # so Larix only needs a plain rtmp://<mac-ip>:1935/ingest/<key> address.
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path: ingest/__STREAM_KEY__
      - action: read             # everyone may watch the public "live" stream
        path: live
  # Only this Mac may read the private ingest stream (to copy it to "live") and use the API.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: read
        path: ingest/__STREAM_KEY__
      - action: api

api: true
apiAddress: 127.0.0.1:9997

rtmp: true             # phone → Mac (Larix Broadcaster, RTMP)
rtmpAddress: :1935
hls: true              # Mac → website viewers
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsVariant: fmp4       # standard HLS: plays everywhere (Safari natively, others via hls.js)
hlsSegmentDuration: 1s
hlsSegmentCount: 7
rtsp: false
webrtc: false
srt: false
moq: false            # unused protocol; leaving it on makes MediaMTX create auto.key/auto.crt here

paths:
  ingest/__STREAM_KEY__:   # phone → here (private)
  live:                    # viewers ← here (public); copies the private stream while it's on air
    source: rtmp://127.0.0.1:1935/ingest/__STREAM_KEY__
    sourceOnDemand: no
